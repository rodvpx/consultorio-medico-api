spring:
  application:
    name: consultorio-medico-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/consultorio_medico}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  admin:
    bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
